reason = "These files name their tests in testCamelCase, as XCTest requires (audit finding BA-5)."
correction = "Rename each test to a snake_case sentence when its file moves to Swift Testing."

[[exception]]
rule = "BASE-32"
paths = ["Tests/LauncherTests/RunnerTests.swift"]
owner = "Luke Randall"
reason = "Two tests compare the elapsed time of a run with an upper bound (audit finding BA-5)."
correction = "Check the runner's reported outcome in place of the elapsed time."
