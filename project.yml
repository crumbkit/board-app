# The Board apps for iPhone, iPad and Mac. `bin/project` generates
# Board.xcodeproj from this file with XcodeGen; the project is not committed.
# bin/project sets BOARD_BUNDLE when Bundle/board exists. Running xcodegen
# directly leaves it unset, which leaves the release out.
include:
  - path: Bundle.yml
    enable: ${BOARD_BUNDLE}
name: Board
options:
  bundleIdPrefix: com.stemmacorp
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 78HLU526FA
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: Board
    PRODUCT_BUNDLE_IDENTIFIER: com.stemmacorp.board
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Board
    # Apps/Shared/AppIcon.icon, an Icon Composer file, is the icon of both
    # apps. Xcode compiles it into each app's asset catalog.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  board-app:
    path: .
targets:
  Board-iOS:
    type: application
    platform: iOS
    scheme: {}
    sources: [Apps/Shared, Apps/iOS]
    dependencies:
      - package: board-app
        product: Pairing
      - package: board-app
        product: SSHSig
      - package: board-app
        product: Requests
    entitlements:
      path: Apps/iOS/Board.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.stemmacorp.board]
        com.apple.developer.icloud-services: [CloudKit]
        # TestFlight builds always use Production, so every build does unless
        # CLOUDKIT_ENVIRONMENT=Development is set, and the phone and the Mac
        # read the same records however each was signed.
        com.apple.developer.icloud-container-environment: $(CLOUDKIT_ENVIRONMENT:default=Production)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSFaceIDUsageDescription: Board uses Face ID to sign what you approve.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # App Store Connect refuses an iPad app that does not allow every
        # orientation, since iPad multitasking needs them.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  Board-macOS:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - Apps/Shared
      - Apps/macOS
    dependencies:
      - package: board-app
        product: Pairing
      - package: board-app
        product: SSHSig
      - package: board-app
        product: Requests
      - package: board-app
        product: Launcher
      - package: board-app
        product: Installer
    entitlements:
      path: Apps/macOS/Board.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.stemmacorp.board]
        com.apple.developer.icloud-services: [CloudKit]
        # TestFlight builds always use Production, so every build does unless
        # CLOUDKIT_ENVIRONMENT=Development is set, and the phone and the Mac
        # read the same records however each was signed.
        com.apple.developer.icloud-container-environment: $(CLOUDKIT_ENVIRONMENT:default=Production)
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
